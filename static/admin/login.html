<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Brains College Admin</title>
  <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo-mark">B</div>
    <h1>Brains College</h1>
    <p class="sub">Sign in to the admission management portal</p>

    <div class="login-err" id="err"></div>

    <label class="field">
      <span>Email</span>
      <input type="email" id="email" placeholder="admin@brainscollege.edu.pk" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </label>

    <button class="btn btn-primary" id="loginBtn" style="width:100%;padding:11px">Sign in</button>

    <div class="login-foot">Authorised staff only · Brains College, Lahore</div>
  </div>

  <script>
    (function () {
      // theme follows the dashboard preference
      var theme = localStorage.getItem('bc_theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
      if (localStorage.getItem('bc_token')) location.href = '/admin';

      var btn = document.getElementById('loginBtn');
      var err = document.getElementById('err');

      async function login() {
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        if (!email || !password) { showErr('Please enter your email and password.'); return; }
        btn.disabled = true; btn.textContent = 'Signing in…'; err.style.display = 'none';
        try {
          var res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.detail || 'Sign-in failed. Please try again.');
          localStorage.setItem('bc_token', data.access_token);
          localStorage.setItem('bc_admin', JSON.stringify(data.admin || {}));
          location.href = '/admin';
        } catch (e) {
          showErr(e.message);
          btn.disabled = false; btn.textContent = 'Sign in';
        }
      }
      function showErr(msg) { err.textContent = msg; err.style.display = 'block'; }

      btn.addEventListener('click', login);
      document.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    })();
  </script>
</body>
</html>
